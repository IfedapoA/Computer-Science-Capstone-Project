# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: test-and-build
 
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
 
# Packages are listed here (not read from requirements*.txt) so CI does not depend on those files being up to date.
# Keep this list in sync with requirements.txt.
env:
  PY_PACKAGES: PySide6 mysql-connector-python pdfplumber pytest reportlab
 
jobs:
  test:
    name: Tests (Ubuntu + MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: capstone
          MYSQL_DATABASE: capstone
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcapstone"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
 
      - name: Check the repository layout
        run: |
          echo "Files at the repository root:"; ls -la
          for f in src/main.py src/Capstone_Database.sql tests/conftest.py; do
            test -f "$f" || { echo "::error::$f is missing. Upload the whole project to the repository root (src/, tests/, docs/ ...)."; exit 1; }
          done
 
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
 
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
 
      - name: Install Python packages
        run: python -m pip install --upgrade pip && python -m pip install $PY_PACKAGES
 
      - name: Run the tests
        run: python -m pytest tests -q
 
  build:
    name: Executable (${{ matrix.os }})
    needs: test
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
 
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
 
      - name: Install Python packages
        run: python -m pip install --upgrade pip && python -m pip install $PY_PACKAGES pyinstaller
 
      - name: Build the executable
        run: python -m PyInstaller packaging/degree_tracker.spec --distpath dist --workpath build -y
 
      - name: Self-test the executable (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/DegreeTracker --version
          dist/DegreeTracker --selftest --skip-db
 
      - name: Self-test the executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\DegreeTracker.exe" -ArgumentList "--selftest","--skip-db" -Wait -PassThru
          Get-Content "$env:USERPROFILE\DegreeTracker\degree_tracker_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }
 
      - name: Assemble the release folder
        run: |
          mkdir -p release/DegreeTracker
          cp dist/DegreeTracker* release/DegreeTracker/
          cp docker-compose.yml release/DegreeTracker/
          cp -r sample_data release/DegreeTracker/sample_data
          cp docs/MENTOR_QUICKSTART.md release/DegreeTracker/README.md
          if [ "$RUNNER_OS" = "Windows" ]; then cp packaging/*.bat release/DegreeTracker/; else cp packaging/start-degree-tracker.sh release/DegreeTracker/; fi
 
      - uses: actions/upload-artifact@v4
        with:
          name: DegreeTracker-${{ runner.os }}
          path: release/DegreeTracker
 
  release:
    name: Attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip each platform
        run: cd artifacts && for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/*.zip }
