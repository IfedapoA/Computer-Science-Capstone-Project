version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: capstone_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: capstone
      MYSQL_DATABASE: capstone
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Mounts your renamed SQL script
      - ./Capstone_Database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
