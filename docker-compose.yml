services:
  db:
    image: mysql:8.0
    container_name: capstone_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-capstone}
      MYSQL_DATABASE: capstone            # creates the empty database; the app builds and seeds the tables itself (migrate.py)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 127.0.0.1 = reachable from this computer only, to protect student records.
      - "127.0.0.1:3306:3306"
    volumes:
      # Data lives in a folder next to this file (./data/mysql), so `docker compose down -v` cannot delete it.
      - ./data/mysql:/var/lib/mysql
      # No SQL files are mounted into docker-entrypoint-initdb.d: tables and catalog data are created
      # safely, once, by the application's numbered migrations (migrate.py).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-capstone}"]
      interval: 5s
      timeout: 5s
      retries: 20
